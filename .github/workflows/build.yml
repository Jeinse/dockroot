name: Build DockRoot

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.23'
  RURI_VERSION: 'v3.9.5'

jobs:
  build:
    name: Build (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            suffix: x86_64
          - goarch: arm64
            suffix: aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build DockRoot
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          GV=$(git log --pretty=format:'%H' -n 1)
          go build \
            -ldflags "-X main.gitCommit=${GV} -s -w" \
            -tags "containers_image_openpgp exclude_graphdriver_btrfs" \
            -o dist/DockRoot \
            ./cmd/dockroot
          file dist/DockRoot

      - name: Bundle ruri
        run: |
          cp "ruri/ruri-${{ matrix.goarch }}" dist/ruri
          chmod +x dist/ruri
          file dist/ruri

          if [ "${{ matrix.goarch }}" = "amd64" ]; then
            ./dist/ruri --help | grep -q -- '--fork-as-init'
            ./dist/ruri -v || true
          else
            grep -qa -- '--fork-as-init' dist/ruri
            echo "cross-arch check passed: --fork-as-init present in arm64 binary"
          fi

      - name: Package
        run: |
          tar -czf DockRoot-linux-${{ matrix.suffix }}.tar.gz -C dist .
          ls -la DockRoot-linux-${{ matrix.suffix }}.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DockRoot-linux-${{ matrix.suffix }}
          path: DockRoot-linux-${{ matrix.suffix }}.tar.gz
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}