name: Build DockRoot

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.23'
  RURI_VERSION: 'v3.9.5'

jobs:
  build:
    name: Build (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            suffix: x86_64
            ruri_asset: ruri-x86_64.tar
          - goarch: arm64
            suffix: aarch64
            ruri_asset: ruri-aarch64.tar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build DockRoot
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" \
            -o dist/DockRoot \
            ./cmd/dockroot
          file dist/DockRoot

      - name: Fetch ruri ${{ env.RURI_VERSION }}
        run: |
          curl -fsSL -o /tmp/ruri.tar \
            "https://github.com/RuriOSS/ruri/releases/download/${{ env.RURI_VERSION }}/${{ matrix.ruri_asset }}"
          mkdir -p /tmp/ruri-extract
          tar -xf /tmp/ruri.tar -C /tmp/ruri-extract
          # 找到解压后的 ruri 二进制
          RURI_BIN=$(find /tmp/ruri-extract -type f -name 'ruri' | head -1)
          if [ -z "$RURI_BIN" ]; then
            echo "ERROR: ruri binary not found in extracted archive"
            find /tmp/ruri-extract -type f | head -20
            exit 1
          fi
          cp "$RURI_BIN" dist/ruri
          chmod +x dist/ruri
          ./dist/ruri --help | grep -q -- '--fork-as-init'
          ./dist/ruri -v || true

      - name: Package
        run: |
          tar -czf DockRoot-linux-${{ matrix.suffix }}.tar.gz -C dist .
          ls -la DockRoot-linux-${{ matrix.suffix }}.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DockRoot-linux-${{ matrix.suffix }}
          path: DockRoot-linux-${{ matrix.suffix }}.tar.gz
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
